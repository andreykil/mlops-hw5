# Три источника технических метрик; бизнес-срезы Grafana читает из PostgreSQL.
global:
  scrape_interval: 1s
  evaluation_interval: 1s
  external_labels:
    project: fraud-monitoring

scrape_configs:
  - job_name: fraud_detector
    static_configs:
      - targets: [fraud_detector:8000]
        labels:
          service: scoring

  - job_name: scoring_writer
    static_configs:
      - targets: [scoring_writer:8001]
        labels:
          service: writer

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
