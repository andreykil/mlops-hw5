apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 1s

  # Тот же PostgreSQL, в который scoring_writer сохраняет результаты.
  - name: PostgreSQL
    uid: postgres
    type: postgres
    access: proxy
    url: $POSTGRES_HOST:$POSTGRES_PORT
    user: $POSTGRES_USER
    editable: false
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
      timeInterval: 10s
      maxOpenConns: 5
      maxIdleConns: 2
    secureJsonData:
      password: $POSTGRES_PASSWORD
