apiVersion: 1

groups:
  - orgId: 1
    name: fraud-services
    folder: Антифрод
    interval: 10s
    rules:
      - uid: fraud-stream-stopped
        title: Остановилась обработка транзакций
        condition: B
        for: 1m
        noDataState: Alerting
        execErrState: Error
        annotations:
          summary: За последнюю минуту не обработано ни одной транзакции
          description: Проверьте симулятор, Kafka и логи fraud_detector.
          __dashboardUid__: fraud-scoring
          __panelId__: '1'
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 120, to: 0}
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              # Если сам скорер недоступен, тоже считаем поток остановленным.
              expr: sum(increase(transactions_total[1m])) * min(up{job="fraud_detector"})
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              type: threshold
              expression: A
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - evaluator: {type: lt, params: [1]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query
      - uid: fraud-scoring-errors
        title: Ошибки скоринга
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Есть ошибки обработки за последнюю минуту
          description: Проверьте формат входных сообщений и доступность модели.
          __dashboardUid__: fraud-scoring
          __panelId__: '4'
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 120, to: 0}
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              expr: sum(increase(transaction_processing_errors_total[1m]))
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              type: threshold
              expression: A
              datasource: {type: __expr__, uid: __expr__}
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query
